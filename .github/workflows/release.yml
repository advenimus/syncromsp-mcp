name: Release

on:
  push:
    branches: [main]

# Least privilege: nothing by default, each job asks for what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.release-check.outputs.released }}
      version: ${{ steps.release-check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Get tags before release
        id: before
        run: echo "latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - name: Install semantic-release plugins
        # Exact versions: this step runs with publish tokens, so it must not pick up a new release unreviewed.
        run: npm install --no-save semantic-release@25.0.9 @semantic-release/commit-analyzer@13.0.1 @semantic-release/release-notes-generator@14.1.1 @semantic-release/npm@13.2.0 @semantic-release/github@12.0.10
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
      - name: Check if new release was created
        id: release-check
        run: |
          git fetch --tags
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')
          OLD_TAG="${{ steps.before.outputs.latest_tag }}"
          echo "Old tag: $OLD_TAG"
          echo "New tag: $NEW_TAG"
          if [ "$NEW_TAG" != "$OLD_TAG" ] && [ "$NEW_TAG" != "none" ]; then
            VERSION="${NEW_TAG#v}"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "New release: $VERSION"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  mcpb:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Prune dev dependencies
        run: npm prune --omit=dev
      - name: Update manifest version
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${{ needs.release.outputs.version }}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb@2.1.2
      - name: Validate manifest
        run: mcpb validate manifest.json
      - name: Pack MCPB bundle
        run: mcpb pack . syncromsp-mcp.mcpb
      - name: Upload MCPB to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" syncromsp-mcp.mcpb \
            --repo ${{ github.repository }} --clobber

  skill:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sync skill version with release tag
        # Used for the standalone skill zip (Claude Desktop / claude.ai upload path).
        # The Claude Code plugin path is git-SHA-versioned by the marketplace and
        # does not need a version bump here.
        run: |
          sed -i "s/^version: .*/version: ${{ needs.release.outputs.version }}/" plugins/syncromsp/skills/syncromsp/SKILL.md
          grep '^version:' plugins/syncromsp/skills/syncromsp/SKILL.md
      - name: Package skill as zip
        run: |
          cd plugins/syncromsp/skills
          zip -r "$GITHUB_WORKSPACE/syncromsp-skill.zip" syncromsp -x "syncromsp/config.json"
          unzip -l "$GITHUB_WORKSPACE/syncromsp-skill.zip"
      - name: Upload skill zip to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" syncromsp-skill.zip \
            --repo ${{ github.repository }} --clobber

  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sync package.json version into build context
        # semantic-release does not push the version bump back to main, so a
        # fresh checkout here has the pre-release version. Without this step
        # the built image self-reports the wrong version in serverInfo and
        # version-check logs.
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ needs.release.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          grep '"version"' package.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ needs.release.outputs.version }}
